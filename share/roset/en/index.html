<!-- people go to the game if it is installed, otherwise to Google Play; link-preview
     crawlers don't run JS, so they still read the title + image above.
     Android: App Links normally open the game before this page even loads; in-app
     browsers (Messenger…) skip that, so the page asks for the app itself with an
     intent: link (Play as the fallback). If nothing happens, Play after a moment. -->
<script>(function () {
  var play = "https://play.google.com/store/apps/details?id=com.mjfoundry.roset";
  if (!/Android/i.test(navigator.userAgent)) return location.replace(play);
  var app = 'intent://' + location.host + location.pathname + location.search +
    '#Intent;scheme=https;package=com.mjfoundry.roset;S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
  var left = false;
  document.addEventListener('visibilitychange', function () { if (document.hidden) left = true; });
  document.addEventListener('DOMContentLoaded', function () {
    var a = document.getElementById('app');
    a.href = app;
    a.hidden = false;
  });
  location.href = app;
  setTimeout(function () { if (!left && !document.hidden) location.replace(play); }, 2500);
})();</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#2b3d63;color:#f6efe6}
a{color:#f6efe6}</style></head><body>
<p><a id="app" hidden>Open the game</a></p>
<p><a href="https://play.google.com/store/apps/details?id=com.mjfoundry.roset">Open Zen Stones on Google Play</a></p>
</body></html>
