name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Pushes the build to the gh-pages branch directly (branch-based Pages),
# rather than the Actions-based deploy API — this lets PR previews live
# alongside production on the same branch, at their own subpaths. See
# .github/workflows/pr-preview.yml.
permissions:
  contents: write

# Allow one concurrent deployment; don't cancel in-progress production deploys
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://mj-foundry.github.io
          BASE_PATH: /app-showcase/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Preserve PR-preview subfolders that already live on this branch —
          # without this, every production deploy would wipe them out.
          keep_files: true
